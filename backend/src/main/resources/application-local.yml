spring:
  config:
    activate:
      on-profile: local

# Local demo: allow a failed assessment to be retaken immediately.
app:
  assessment:
    cooldown-hours: 0

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    persist-authorization: true

logging:
  level:
    com.fairfold: DEBUG
    org.flywaydb: INFO
