spring:
  config:
    activate:
      on-profile: local

# Local demo: allow a failed assessment to be retaken immediately.
app:
  assessment:
    cooldown-hours: 0
  mfa:
    # Local-only fallback so MFA can be tried without a .env key.
    encryption-key: ${MFA_ENCRYPTION_KEY:ZGV2LW9ubHktZmFpcmZvbGQtbWZhLWtleS0zMmJ5dGU=}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    persist-authorization: true

logging:
  level:
    com.fairfold: DEBUG
    org.flywaydb: INFO
