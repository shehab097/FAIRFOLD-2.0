spring:
  application:
    name: fairfold
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fairfold}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
    username: ${DB_USER:fairfold}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. "validate" is off because MariaDB reports
      # `json` columns as `longtext`, which fails Hibernate's JSON type check.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  error:
    include-message: never

app:
  storage-dir: ${STORAGE_DIR:../data/resumes}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cookie-secure: false
  auth:
    require-email-verification: false
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: 15
  mail:
    mode: ${MAIL_MODE:console}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  ai:
    provider: ${AI_PROVIDER:fallback}
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    price-input-per-m: ${AI_PRICE_INPUT_PER_M:0.30}
    price-output-per-m: ${AI_PRICE_OUTPUT_PER_M:1.20}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    max-tokens: ${AI_MAX_TOKENS:4000}
  resources:
    link-check-cron: "${RESOURCE_LINK_CHECK_CRON:0 0 3 * * SUN}"
  assessment:
    cooldown-hours: ${ASSESSMENT_COOLDOWN_HOURS:48}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# The backend runs from backend/, so ".." resolves to the repository root
# where .env lives (loaded by spring-dotenv for local development).
springdotenv:
  directory: ..
  ignore-if-missing: true
